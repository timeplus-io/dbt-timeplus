[pytest]
filterwarnings =
    ignore:.*'soft_unicode' has been renamed to 'soft_str'*:DeprecationWarning
    ignore:unclosed file .*:ResourceWarning
    # dbt-core 1.10 uses deprecated click OptionParser/ParsingState; suppress noise in CI
    ignore:.*OptionParser.*deprecated.*:DeprecationWarning:dbt\.cli\.options
    ignore:.*ParsingState.*deprecated.*:DeprecationWarning:dbt\.cli\.options
    ignore::pytest.PytestAssertRewriteWarning
env_files =
    test.env
pythonpath = .
testpaths =
    tests/functional  # name per convention
    tests/integration  # name per convention
