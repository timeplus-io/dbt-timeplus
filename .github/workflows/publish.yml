name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract tag version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify code versions match tag
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          CODE=$(sed -n "s/^version = '\(.*\)'/\1/p" dbt/adapters/timeplus/__version__.py)
          MACRO=$(sed -n "s/^version: \(.*\)$/\1/p" dbt/include/timeplus/dbt_project.yml | head -n1)
          echo "Tag: $TAG, code: $CODE, macro: $MACRO"
          if [ "$CODE" != "$TAG" ] || [ "$MACRO" != "$TAG" ]; then
            echo "Error: version mismatch. Bump versions then retag."
            exit 1
          fi
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build dist
        run: |
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
